<p>Medidas de la prenda en plano, en centímetros. Pueden variar ±2 cm porque se cosen a mano, no en un laboratorio.</p>
<p><strong>El truco infalible:</strong> coge una prenda tuya que te quede como te gusta, extiéndela sobre la mesa y mide de axila a axila (ancho) y del hombro al bajo (largo). Compara con la tabla y listo.</p>
