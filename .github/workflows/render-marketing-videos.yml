name: 🎬 Render marketing videos

# Genera los 10 MP4 de marketing con Remotion + ElevenLabs. Se dispara
# a mano desde la web de GitHub. Los MP4 se suben como artifact
# descargable (no se comitean al repo · pesan demasiado).
#
# Requisitos previos (una vez):
#   Settings → Secrets and variables → Actions → New repository secret
#     ELEVENLABS_API_KEY  · tu API key de ElevenLabs
#     ELEVENLABS_VOICE_ID · id de voz español ES (ej: 'Marta', 'David')

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug concreto (vacío = todos los 10)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: tools/video-marketing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/video-marketing/package-lock.json

      - name: Instalar ffmpeg + Chromium deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install deps
        run: npm install

      - name: Generar voces con ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            node scripts/gen-voices.mjs "${{ inputs.slug }}"
          else
            node scripts/gen-voices.mjs
          fi

      - name: Renderizar vídeos con Remotion
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            node scripts/render-all.mjs "${{ inputs.slug }}"
          else
            node scripts/render-all.mjs
          fi

      - name: Resumen
        if: always()
        run: |
          echo "### MP4 renderizados" >> $GITHUB_STEP_SUMMARY
          ls -lh out/*.mp4 2>/dev/null | awk '{print "- " $NF " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "(ninguno)" >> $GITHUB_STEP_SUMMARY

      - name: Subir MP4 como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiestago-marketing-videos
          path: tools/video-marketing/out/*.mp4
          retention-days: 30
          if-no-files-found: warn
