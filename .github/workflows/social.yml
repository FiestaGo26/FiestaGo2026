name: 📲 Redes · publicar y medir

# Publica en Instagram y TikTok (vía Upload-Post) lo que prepara el
# Agente CEO y el vídeo diario, tras una revisión automática de marca,
# y trae las métricas de cada publicación para que el CEO aprenda.
# Tope diario y pausa en ceo_settings (panel → CEO).
#
# Requisitos en Netlify: UPLOADPOST_API_KEY y UPLOADPOST_USER.
# Sin ellos el endpoint responde "sin configurar" y no hace nada.
#
# Horas pensadas para el público español (UTC): 08, 11, 17 y 19 →
# 10, 13, 19 y 21 h en Madrid en verano (una menos en invierno).
on:
  schedule:
    - cron: '7 8,11,17,19 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: social
      cancel-in-progress: false
    env:
      SITE_URL:    ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Publicar la siguiente pieza
        run: |
          curl -sS -X POST "$SITE_URL/api/cron/social" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d '{"op":"publish"}' --max-time 60 || true
          echo ""

      - name: Actualizar métricas
        run: |
          curl -sS -X POST "$SITE_URL/api/cron/social" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d '{"op":"metrics"}' --max-time 60 || true
          echo ""
