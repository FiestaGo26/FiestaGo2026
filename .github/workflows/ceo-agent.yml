name: 🧠 Agente CEO

# Rutinas del Agente CEO de FiestaGo (lib/ceo-agent.ts):
#   · Parte diario    → la primera pasada desde las 07:00 Madrid
#   · Informe semanal → la primera pasada del lunes desde las 09:00
#   · Ejecución       → en cada pasada, las acciones aprobadas (por el
#                       propio CEO en autonomía total, o por ti desde el
#                       admin / WhatsApp)
# Las acciones son endpoints existentes con sus límites (lib/ceo-actions.ts),
# con topes diarios y pausa en ceo_settings. Pagos nunca.
#
# Los crons de GitHub se retrasan horas o se saltan en horas punta, así
# que no dependemos de cuál disparó: cada pasada (cada 20 min) mira la
# hora de Madrid y pide la rutina con if_missing (el servidor la salta
# si ya hay informe hoy / esta semana), y luego ejecuta la cola.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'daily, weekly o execute (solo ejecutar acciones)'
        required: false
        default: 'daily'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ceo-agent
      cancel-in-progress: false
    env:
      SITE_URL:    ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Decidir rutina
        id: kind
        run: |
          KIND="${{ inputs.kind }}"
          IF_MISSING=false
          if [ -z "$KIND" ]; then
            HOUR=$(TZ=Europe/Madrid date +%-H)
            DOW=$(TZ=Europe/Madrid date +%u)   # 1 = lunes
            if [ "$DOW" = "1" ] && [ "$HOUR" -ge 9 ]; then KIND=weekly
            elif [ "$HOUR" -ge 7 ]; then KIND=daily
            else KIND=execute; fi
            IF_MISSING=true
          fi
          echo "Rutina: $KIND (if_missing=$IF_MISSING)"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "if_missing=$IF_MISSING" >> "$GITHUB_OUTPUT"

      - name: Ejecutar rutina del CEO
        if: steps.kind.outputs.kind != 'execute'
        run: |
          set -e
          KIND="${{ steps.kind.outputs.kind }}"
          RESPONSE=$(curl -sS -X POST "$SITE_URL/api/cron/ceo-agent" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d "{\"kind\":\"$KIND\",\"if_missing\":${{ steps.kind.outputs.if_missing }}}" \
            -w "\nHTTP_CODE:%{http_code}" \
            --max-time 90 || true)
          HTTP_CODE=$(echo "$RESPONSE" | grep -oE 'HTTP_CODE:[0-9]+' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed -E 's/HTTP_CODE:[0-9]+$//')
          echo "$BODY" | head -c 3000
          echo ""
          echo "HTTP $HTTP_CODE"
          # 504 = el proxy de Netlify corta a los ~30 s, pero la función sigue
          # y guarda el informe. No paramos: hay que ejecutar la cola igual.
          if [ "$HTTP_CODE" = "504" ]; then echo "::warning::Rutina cortada por timeout del proxy; el informe se guarda igualmente"; exit 0; fi
          if [ "$HTTP_CODE" != "200" ]; then exit 1; fi

      - name: Ejecutar acciones aprobadas
        run: |
          # Máximo 15 acciones por pasada. Cada una se reclama, se ejecuta
          # llamando a su endpoint (60s cada uno en Netlify) y se registra.
          for i in $(seq 1 15); do
            NEXT=$(curl -sS -X POST "$SITE_URL/api/cron/ceo-execute" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: $CRON_SECRET" \
              -d '{"op":"next"}' --max-time 30 || echo '{"none":true,"reason":"error de red"}')
            if echo "$NEXT" | jq -e '.none' > /dev/null 2>&1; then
              echo "⏹ $(echo "$NEXT" | jq -r '.reason // "nada pendiente"')"
              break
            fi
            ID=$(echo "$NEXT" | jq -r '.id')
            ENDPOINT=$(echo "$NEXT" | jq -r '.endpoint')
            BODY=$(echo "$NEXT" | jq -c '.body')
            echo "────────────────────────────────────────"
            echo "▶ $(echo "$NEXT" | jq -r '.type') · $(echo "$NEXT" | jq -r '.title')"
            echo "  $ENDPOINT $BODY"

            RES=$(curl -sS -X POST "$SITE_URL$ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: $CRON_SECRET" \
              -d "$BODY" \
              -w "\nHTTP_CODE:%{http_code}" --max-time 90 || true)
            CODE=$(echo "$RES" | grep -oE 'HTTP_CODE:[0-9]+' | cut -d: -f2)
            OUT=$(echo "$RES" | sed -E 's/HTTP_CODE:[0-9]+$//')
            echo "$OUT" | head -c 1500
            echo ""
            echo "  HTTP ${CODE:-000}"
            OK=false; [ "$CODE" = "200" ] && OK=true

            jq -nc --arg id "$ID" --argjson ok "$OK" --arg out "$OUT" --arg code "${CODE:-000}" \
              '{op:"complete", id:$id, ok:$ok, result:{http:$code, body:($out | fromjson? // $out)}}' \
              > /tmp/complete.json
            curl -sS -X POST "$SITE_URL/api/cron/ceo-execute" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: $CRON_SECRET" \
              --data-binary @/tmp/complete.json --max-time 30 > /dev/null || true
            sleep 5
          done
